{% include "vistas/header.html" %}
		<!-- End Header/Navigation -->

		<!-- Start Hero Section -->
			<div class="hero">
				<div class="container">
					<div class="row justify-content-between">
						<div class="col-lg-5">
							<div class="intro-excerpt">
								<h1>Shop</h1>
							</div>
						</div>
						<div class="col-lg-7">
							
						</div>
					</div>
				</div>
			</div>
		<!-- End Hero Section -->

		

	<div class="untree_co-section product-section before-footer-section">
		<div class="container">
			<form method="GET" action="{{ url_for('shop') }}" class="mb-4">
				<div class="row">
					<div class="col-md-4">
					<select name="categoria" class="form-select" onchange="this.form.submit()">
						<option value="">Todas las categorías</option>
						{% for categoria in categorias %}
						<option value="{{ categoria.id }}" {% if categoria.id|string == request.args.get('categoria') %}selected{% endif %}>
							{{ categoria.nombre }}
						</option>
						{% endfor %}
					</select>
					</div>
				</div>
			</form>

			<div class="row">
			{% for producto in productos %}
				<div class="col-12 col-md-4 col-lg-3 mb-5">
					<a class="product-item" href="#" 
						data-bs-toggle="modal" 
						data-bs-target="#productModal"
						data-id="{{ producto.id }}"
						data-nombre="{{ producto.nombre }}"
						data-descripcion="{{ producto.descripcion }}"
						data-precio="{{ '{:.2f}'.format(producto.precio) }}"
						data-imagen="{{ producto.imagen_url }}"
						data-galeria="{{ producto.galeria_json }}">  <!-- galeria_json debe ser una lista de URLs en JSON -->
					<img src="{{ producto.imagen_url or 'https://dummyimage.com/450x300/dee2e6/6c757d.jpg' }}" class="img-fluid product-thumbnail">
					<h3 class="product-title">{{ producto.nombre }}</h3>
					<strong class="product-price">${{ '{:.2f}'.format(producto.precio) }}</strong>

					<span class="icon-cross">
					<img src="{{ url_for('static', filename='images/cross.svg') }}" class="img-fluid">
					</span>
				</a>
				</div>
			{% endfor %}
			</div>
		</div>
	</div>

	<!-- Modal -->
	<div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-lg modal-dialog-centered">
			<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="modal-product-title">Título del producto</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
			</div>
			<div class="modal-body">
				<img id="modal-product-image" src="" alt="Imagen producto" class="img-fluid mb-3">
				<p id="modal-product-description"></p>
				<p><strong id="modal-product-price"></strong></p>
				<form id="add-to-cart-form" method="POST" action="#">
				<button type="submit" class="btn btn-primary">Agregar al carrito</button>
				</form>
			</div>
			</div>
		</div>
	</div>



<!-- Start Footer Section -->
{% include "vistas/bottom.html" %}
